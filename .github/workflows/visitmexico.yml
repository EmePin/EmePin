name: Update Visit Mexico

on:
  workflow_dispatch:

  schedule:
    - cron: "0 10 * * 1"
      timezone: "America/Mexico_City"

permissions:
  contents: write

jobs:
  update-visitmexico:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Visit Mexico posts
        env:
          REEF_API_KEY: ${{ secrets.REEF_API_KEY }}
        run: |
          node scripts/visitmexico.js

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: update Visit Mexico posts"
          git push